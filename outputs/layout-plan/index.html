<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>影知 · 布局重规划 v4 线框预览</title>
<style>
  :root{
    --ink:#16272e; --ink2:#3c5560; --muted:#6d838d; --faint:#9db0b8;
    --line:#d7e2e6; --line2:#e8eff1; --fill:#f1f6f7; --fill2:#e4eef0;
    --brand:#0b4f55; --brand2:#12767d; --warn:#b4791f; --bg:#f6f9fa;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  .topbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .topbar h1{margin:0;font-size:15px;letter-spacing:.2px}
  .topbar h1 span{font-weight:500;color:var(--muted);font-size:12.5px;margin-left:8px}
  .grp{display:flex;align-items:center;gap:6px}
  .grp>label{font-size:11px;color:var(--faint);letter-spacing:.08em;margin-right:2px}
  .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
  .seg button{border:0;background:#fff;padding:6px 11px;font-size:12px;color:var(--ink2);cursor:pointer;font-family:inherit}
  .seg button+button{border-left:1px solid var(--line)}
  .seg button.on{background:var(--brand);color:#fff}
  .hint{font-size:11.5px;color:var(--faint);margin-left:auto}
  .stage{padding:20px;overflow:auto}
  .scaler{transform-origin:top left}
  .canvas{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 8px 30px rgba(11,79,85,.07);font-size:12px}
  /* 线框通用 */
  .ph{border:1px dashed #c6d6db;border-radius:7px;background:#fbfdfd}
  .lbl{font-size:9.5px;color:var(--faint);font-family:var(--mono);letter-spacing:.02em}
  .ttl{font-weight:700}
  .row{display:flex;align-items:center}
  .grow{flex:1;min-width:0}
  .btn{border:1px solid var(--line);border-radius:7px;padding:6px 10px;background:#fff;font-size:11px;color:var(--ink2);white-space:nowrap}
  .btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.gh{background:var(--fill);border-color:transparent}
  .chip{display:inline-block;border:1px solid var(--line);border-radius:20px;padding:2px 8px;font-size:10px;color:var(--ink2);background:#fff}
  .chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .chip.soft{background:var(--fill);border-color:transparent}
  /* 外壳 */
  .ctx{height:56px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:16px;padding:0 16px;border-bottom:1px solid var(--line);background:#fff;position:relative}
  .mark{width:30px;height:30px;border-radius:8px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
  .brand b{display:block;font-size:13px;line-height:1.2}
  .brand span{display:block;font-size:9.5px;color:var(--faint)}
  .badge{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:20px;padding:4px 10px;background:var(--fill);font-size:11px}
  .identity{display:flex;align-items:center;gap:8px;border:1px solid rgba(11,79,85,.3);background:#fff;border-radius:24px;padding:3px 11px 3px 3px;cursor:pointer;box-shadow:0 1px 3px rgba(11,79,85,.08);transition:.15s}
  .identity:hover{border-color:var(--brand);box-shadow:0 3px 10px rgba(11,79,85,.16)}
  .identity .av{width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:11.5px;font-weight:700;letter-spacing:0}
  .identity .who b{display:block;font-size:11px;line-height:1.25;color:var(--ink)}
  .identity .who span{display:block;font-size:9px;color:var(--faint);line-height:1.2}
  .identity .car{font-size:8.5px;color:var(--brand);margin-left:2px}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--brand2)}
  .searchwrap{display:flex;justify-content:center;min-width:0}
  .search{width:100%;max-width:460px;height:34px;border:1px solid var(--line);border-radius:9px;display:flex;align-items:center;gap:8px;padding:0 10px;color:var(--faint);background:#fff}
  .kbd{margin-left:auto;font-size:9.5px;border:1px solid var(--line);border-radius:4px;padding:1px 4px;color:var(--faint)}
  .shell{display:grid;grid-template-columns:232px minmax(0,1fr) 34px;align-items:stretch}
  .shell.compact{grid-template-columns:56px minmax(0,1fr) 0}
  .nav{border-right:1px solid var(--line);background:#fcfdfd;padding:10px 10px 14px;display:flex;flex-direction:column;gap:2px}
  .nav .item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;color:var(--ink2);font-size:12px}
  .nav .item.on{background:#fff;border:1px solid var(--line);color:var(--brand);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.03)}
  .nav .ic{width:16px;height:16px;border:1.4px solid currentColor;border-radius:4px;opacity:.55;flex:none}
  .nav .sep{height:1px;background:var(--line2);margin:8px 6px}
  .nav .foot{margin-top:auto;font-size:9.5px;color:var(--faint);line-height:1.6;border:1px dashed var(--line);border-radius:8px;padding:8px}
  .shell.compact .nav{padding:10px 6px;align-items:center}
  .shell.compact .nav .item{padding:8px;justify-content:center}
  .shell.compact .nav .item span:not(.ic){display:none}
  .shell.compact .nav .foot,.shell.compact .nav .sep{display:none}
  .main{padding:20px 24px 28px;min-width:0}
  .evr{border-left:1px solid var(--line);background:#fbfdfd;display:flex;align-items:center;justify-content:center}
  .evr .fold{writing-mode:vertical-rl;font-size:9.5px;color:var(--faint);letter-spacing:.16em;display:flex;align-items:center;gap:6px}
  .evr .fold i{width:14px;height:14px;border:1.3px solid var(--faint);border-radius:50%;font-style:normal;display:grid;place-items:center;font-size:8px;letter-spacing:0}
  /* 页头 */
  .phead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:14px}
  .eyebrow{font-size:9.5px;letter-spacing:.18em;color:var(--faint);font-family:var(--mono)}
  .phead h2{margin:3px 0 0;font-size:20px;letter-spacing:.2px}
  .phead p{margin:4px 0 0;font-size:11.5px;color:var(--muted);max-width:620px;line-height:1.6}
  .acts{display:flex;gap:7px;flex:none}
  /* 检索行 */
  .searchrow{display:flex;align-items:center;gap:7px;margin-bottom:12px;flex-wrap:nowrap}
  .sinput{flex:1;height:34px;border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;gap:7px;padding:0 10px;color:var(--faint);background:#fff;font-size:11px}
  /* 阅读两列 */
  .read{display:grid;grid-template-columns:280px minmax(0,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
  .list{border-right:1px solid var(--line);background:#fbfdfd;padding:0 0 8px}
  .list-h{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;font-size:11px;position:sticky;top:0;background:#fbfdfd}
  .li{padding:9px 12px;border-left:2px solid transparent}
  .li.on{background:#fff;border-left-color:var(--brand)}
  .li b{display:block;font-size:11.5px;margin-bottom:2px}
  .li em{display:block;font-style:normal;font-family:var(--mono);font-size:9px;color:var(--faint)}
  .li p{margin:3px 0 5px;font-size:10px;color:var(--muted);line-height:1.5}
  .detail{padding:18px 22px;min-width:0}
  .dhead{display:flex;align-items:flex-start;gap:10px}
  .dhead h3{margin:0;font-size:21px;letter-spacing:.3px}
  .dhead .en{font-family:var(--mono);font-size:10px;color:var(--faint);margin-top:2px}
  .tags{display:flex;gap:5px;margin:10px 0 12px;flex-wrap:wrap}
  .lead{font-size:12.5px;line-height:1.75;color:var(--ink2);border-left:2px solid var(--brand2);padding:2px 0 2px 11px;background:#f8fcfc;border-radius:0 6px 6px 0}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
  .blk h4{margin:0 0 6px;font-size:10px;color:var(--faint);letter-spacing:.1em}
  .blk ul{margin:0;padding-left:14px;font-size:11px;line-height:1.8;color:var(--ink2)}
  .fold2{margin-top:14px;border:1px solid var(--line);border-radius:8px;padding:9px 11px;display:flex;align-items:center;gap:8px;background:#fbfdfd;font-size:11px;color:var(--ink2)}
  .fold2 .n{margin-left:auto;font-size:9.5px;color:var(--faint)}
  /* 专注 */
  .cbanner{height:52px;background:#123037;color:#eaf4f4;display:flex;align-items:center;gap:12px;padding:0 14px;margin:-20px -24px 0}
  .cbanner .cid{font-family:var(--mono);font-size:10px;opacity:.7}
  .cbanner b{font-size:12.5px}
  .cbanner .st{margin-left:auto;display:flex;gap:6px}
  .cbanner .st span{font-size:9.5px;border:1px solid rgba(255,255,255,.28);border-radius:20px;padding:3px 8px}
  .focus{display:grid;grid-template-columns:260px minmax(0,1fr) 340px;border:1px solid var(--line);border-top:0;margin:0 -24px;background:#fff}
  .queue{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:560px}
  .q-h{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;font-size:11px}
  .q-s{padding:8px 10px;border-bottom:1px solid var(--line)}
  .q-s .sinput{height:30px}
  .qi{padding:8px 10px;display:flex;gap:8px;align-items:center;border-left:2px solid transparent}
  .qi.on{background:#f3f9f9;border-left-color:var(--brand)}
  .qi .thumb{width:34px;height:34px;border-radius:5px;background:repeating-linear-gradient(135deg,#dfe9ec 0 4px,#eef4f5 4px 8px);flex:none;border:1px solid var(--line)}
  .qi b{display:block;font-size:10.5px;font-weight:600}
  .qi span{display:block;font-size:9px;color:var(--faint)}
  .viewer{background:#123037;padding:10px;display:flex;flex-direction:column;min-width:0}
  .vh{display:flex;justify-content:space-between;align-items:center;color:#dcecec;font-size:10.5px;padding:0 2px 8px}
  .vh .chips{display:flex;gap:5px}
  .vh .chips span{font-size:9px;border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:2px 7px}
  .img{flex:1;min-height:380px;background:repeating-linear-gradient(135deg,#20373d 0 6px,#1a2e34 6px 12px);border-radius:4px;position:relative;display:grid;place-items:center}
  .img .frame{position:absolute;inset:14% 12%;border:1px solid rgba(255,255,255,.35);display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr 1fr}
  .img .frame i{border:1px solid rgba(255,255,255,.22);font-style:normal;color:rgba(255,255,255,.65);font-size:9px;display:grid;place-items:center}
  .legend{display:flex;flex-wrap:wrap;gap:4px;padding-top:8px}
  .legend span{font-size:9px;color:#cfe3e3;border:1px solid rgba(255,255,255,.18);border-radius:20px;padding:2px 7px}
  .concl{border-left:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:8px;min-height:560px}
  .cc{border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:#fff}
  .cc p{margin:0 0 7px;font-size:10.5px;line-height:1.6;color:var(--ink2)}
  .cc .m{display:flex;gap:5px;flex-wrap:wrap}
  .wactions{height:56px;border-top:1px solid var(--line);background:rgba(255,255,255,.92);backdrop-filter:blur(8px);display:flex;align-items:center;gap:8px;padding:0 14px;margin:0 -24px -28px;position:sticky;bottom:0}
  .wactions .sp{margin-left:auto}
  /* 首页 */
  .hero2{background:linear-gradient(120deg,#0b4f55,#12767d);border-radius:12px;padding:22px 24px;color:#fff;display:flex;align-items:center;gap:24px;flex-wrap:wrap}
  .phone .hero2{flex-direction:column;align-items:stretch;gap:12px}
  .phone .hero2 .path{min-width:0;margin-left:0}
  .phone .hero2 h2{font-size:17px}
  .hero2 h2{margin:0 0 6px;font-size:22px;letter-spacing:.3px}
  .hero2 p{margin:0 0 14px;font-size:11.5px;opacity:.85;line-height:1.6;max-width:520px}
  .hero2 .b3{display:flex;gap:8px}
  .hero2 .b3 .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.28);color:#fff}
  .hero2 .b3 .btn.solid{background:#fff;color:var(--brand);border-color:#fff}
  .path{margin-left:auto;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);border-radius:10px;padding:12px 14px;min-width:300px}
  .path .ph-h{font-size:9.5px;opacity:.7;letter-spacing:.14em;margin-bottom:8px}
  .step{display:flex;align-items:center;gap:8px;font-size:10.5px;padding:3px 0}
  .step i{width:15px;height:15px;border-radius:50%;border:1px solid rgba(255,255,255,.5);font-style:normal;font-size:8.5px;display:grid;place-items:center;flex:none}
  .step.done i{background:#fff;color:var(--brand);border-color:#fff}
  .step.now i{background:rgba(255,255,255,.9);color:var(--brand);border-color:#fff}
  .sec{margin-top:18px}
  .sec-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:9px}
  .sec-h h3{margin:0;font-size:13px}
  .sec-h span{font-size:10px;color:var(--faint)}
  .cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .card2{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff;min-height:118px;display:flex;flex-direction:column}
  .card2 .k{font-size:9.5px;color:var(--faint);letter-spacing:.08em}
  .card2 b{display:block;font-size:12px;margin:5px 0 3px}
  .card2 p{margin:0;font-size:10px;color:var(--muted);line-height:1.6}
  .card2 .btn{margin-top:auto;align-self:flex-start}
  .card2 .img2{height:44px;border-radius:6px;background:repeating-linear-gradient(135deg,#dfe9ec 0 5px,#eef4f5 5px 10px);margin:6px 0;border:1px solid var(--line)}
  .chainbar{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:10px;padding:12px 0;background:#fff}
  .chainbar .cb{padding:0 14px;border-right:1px solid var(--line2)}
  .chainbar .cb:last-child{border-right:0}
  .phone .chainbar{padding:12px;row-gap:12px;column-gap:0}
  .cb{font-size:10px;color:var(--ink2)}
  .cb .t{display:flex;justify-content:space-between;margin-bottom:5px}
  .cb .t b{font-size:11px}
  .track{height:5px;border-radius:3px;background:var(--fill2);overflow:hidden}
  .track i{display:block;height:100%;background:var(--brand2)}
  .base{margin-top:10px;font-size:10px;color:var(--faint);display:flex;gap:14px;flex-wrap:wrap}
  /* 移动 */
  .phone{width:390px;background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 10px 30px rgba(11,79,85,.12)}
  .phone .ctx{height:52px;padding:0 12px;gap:8px;display:flex;align-items:center}
  .phone .search{display:none}
  .phone .pmain{padding:14px;min-height:600px}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:#fff;padding:6px 0 10px}
  .tabbar div{text-align:center;font-size:9px;color:var(--faint)}
  .tabbar div.on{color:var(--brand);font-weight:600}
  .tabbar i{display:block;width:18px;height:18px;border:1.4px solid currentColor;border-radius:5px;margin:0 auto 4px;opacity:.6}
  /* 产品首页 */
  .lp{background:#fff}
  .lp-nav{height:52px;display:flex;align-items:center;gap:20px;padding:0 28px;border-bottom:1px solid var(--line);font-size:11px;color:var(--ink2)}
  .lp-hero{margin:0 28px;background:linear-gradient(120deg,#0b4f55,#12767d);border-radius:12px;padding:26px 28px;color:#fff}
  .lp-hero h2{margin:0 0 8px;font-size:26px;line-height:1.3}
  .lp-hero p{margin:0 0 14px;font-size:11.5px;opacity:.85;max-width:560px;line-height:1.7}
  .lp-body{display:grid;grid-template-columns:minmax(300px,2fr) minmax(0,3fr);gap:14px;padding:20px 28px 28px}
  .model{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}
  .model .box{height:330px;border-radius:8px;background:radial-gradient(circle at 50% 30%,#24434a,#132a30);display:grid;place-items:center;color:#7fa6ad;font-size:10px}
  .panel2{border:1px solid var(--line);border-radius:10px;padding:14px;background:#fff}
  .panel2 h4{margin:0 0 10px;font-size:11.5px}
  .mini{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-bottom:14px}
  .mini div{border:1px solid var(--line);border-radius:7px;padding:8px 4px;text-align:center;font-size:9.5px;color:var(--ink2);background:#fbfdfd}
  .mini b{display:block;font-size:13px;color:var(--brand);margin-bottom:2px}
  .sigrow{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line2);font-size:10.5px}
  .sigrow:last-child{border-bottom:0}
  .note{margin:0 28px 24px;padding:10px 12px;border:1px dashed var(--line);border-radius:8px;font-size:10px;color:var(--muted);line-height:1.7}
  .empty{border:1px dashed var(--line);border-radius:8px;padding:22px;text-align:center;color:var(--faint);font-size:10.5px}
</style>
</head>
<body>
<div class="topbar">
  <h1>影知 · 布局重规划 v4<span>线框预览（非最终视觉）</span></h1>
  <div class="grp"><label>角色</label><div class="seg" id="segRole">
    <button data-v="student" class="on">学生</button><button data-v="teacher">教师</button><button data-v="doctor">医生</button>
  </div></div>
  <div class="grp"><label>页面</label><div class="seg" id="segPage">
    <button data-v="home" class="on">首页</button><button data-v="read">阅读</button><button data-v="focus">专注</button><button data-v="landing">产品首页</button><button data-v="mobile">移动端</button>
  </div></div>
  <span class="hint">证据栏默认收起为 34px · 右上角身份按钮可切换演示角色</span>
</div>

<div class="stage">
  <div class="scaler" id="scaler"><div id="canvas"></div></div>
</div>

<script>
const S = { role: "student", page: "home", mpage: "home", menu: false };

const NAV = {
  student: ["首页","学 · 基础知识","迁 · 临床迁移","练 · 病例演练","用 · 实习任务"],
  teacher: ["教学首页","学 · 备课","迁 · 迁移设计","练 · 组卷","教 · 班级"],
  doctor: ["临床首页","学 · 速查","迁 · 鉴别","练 · 读片演练","用 · 工作台"],
};
const ROLE_LABEL = { student:"学生端 · 医学生", teacher:"教师端 · 带教老师", doctor:"医生端 · 影像科" };

function ctx(){
  const menu = S.menu ? `
    <div style="position:absolute;right:16px;top:54px;width:224px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(11,79,85,.16);padding:6px;z-index:30;font-size:11px">
      <div class="lbl" style="padding:7px 9px 5px">当前身份</div>
      <div style="padding:6px 9px;display:flex;align-items:center;gap:7px;color:var(--brand);font-weight:600"><span style="width:6px;height:6px;border-radius:50%;background:var(--brand)"></span>${ROLE_LABEL[S.role]}</div>
      <div style="height:1px;background:var(--line2);margin:6px 4px"></div>
      <div class="lbl" style="padding:7px 9px 5px">切换演示角色</div>
      ${["student","teacher","doctor"].map(k=>`<div style="padding:7px 9px;border-radius:7px;display:flex;align-items:center;gap:7px;${k===S.role?'background:var(--fill);font-weight:600':''}">${k===S.role?'<span style="color:var(--brand)">✓</span>':'<span style="width:10px"></span>'}${ROLE_LABEL[k]}</div>`).join("")}
      <div style="height:1px;background:var(--line2);margin:6px 4px"></div>
      <div style="padding:7px 9px;border-radius:7px;color:var(--ink2)">重置本地进度</div>
      <div style="padding:7px 9px;border-radius:7px;color:var(--ink2)">关于与合规</div>
    </div>` : "";
  return `<div class="ctx">
    <div class="row" style="gap:10px">
      <div class="mark">影</div>
      <div class="brand"><b>影知</b><span>影像临床思维平台</span></div>
    </div>

  const mseg = `<div class="seg" id="segM" style="font-size:11px">${[["home","首页"],["read","阅读"],["focus","专注"]].map(([k,t])=>`<button data-m="${k}" class="${S.mpage===k?'on':''}">${t}</button>`).join("")}</div>`;
  return `<div style="display:flex;flex-direction:column;align-items:center;gap:12px">
    <div style="display:flex;align-items:center;gap:10px"><span class="lbl">移动端 · 390 × 844</span>${mseg}</div>
    <div class="phone">
    <div class="ctx"><div class="mark" style="width:26px;height:26px;font-size:12px">影</div><b style="font-size:12px">影知</b>
      <div class="identity" style="margin-left:auto;padding:2px 8px 2px 2px;gap:6px">
        <span class="av" style="width:26px;height:26px;font-size:10px">${S.role==='student'?'学':S.role==='teacher'?'教':'医'}</span>
        <span class="who"><b style="font-size:10px">${S.role==='student'?'学生端':S.role==='teacher'?'教师端':'医生端'}</b></span>
        <span class="car">▼</span>
      </div></div>
    <div class="pmain">${body}</div>
    <div class="tabbar">${tab.map((t,i)=>`<div class="${i===0?'on':''}"><i></i>${t}</div>`).join("")}</div>
    </div>
  </div>`;
}

function render(){
  const c = document.getElementById("canvas");
  if (S.page === "mobile") {
    c.innerHTML = mobile();
    c.style.width = "390px";
    c.style.margin = "0 auto";
  } else {
    if (S.page === "landing") {
      c.innerHTML = landing();
    } else {
      const inner = S.page === "read" ? read() : S.page === "focus" ? focus() : home();
      c.innerHTML = shell(inner, S.page === "focus");
    }
    c.style.width = "1440px";
    c.style.margin = "0";
  }
  const stage = document.querySelector(".stage");
  const avail = stage.clientWidth - 40;
  const w = parseInt(c.style.width, 10) || 1440;
  const scale = Math.min(1, avail / w);
  const sc = document.getElementById("scaler");
  sc.style.transform = `scale(${scale})`;
  sc.style.height = (c.offsetHeight * scale) + "px";
  sc.style.width = (w * scale) + "px";
  sc.style.margin = "0 auto";
}

document.getElementById("segRole").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  S.role = b.dataset.v;
  [...e.currentTarget.children].forEach(x=>x.classList.toggle("on", x===b));
  render();
});
document.getElementById("segPage").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  S.page = b.dataset.v;
  [...e.currentTarget.children].forEach(x=>x.classList.toggle("on", x===b));
  render();
});
document.getElementById("canvas").addEventListener("click", e=>{
  if (e.target.closest(".identity")) { S.menu = !S.menu; render(); return; }
  const m = e.target.closest("[data-m]");
  if (m) { S.mpage = m.dataset.m; render(); return; }
  if (S.menu && !e.target.closest('[style*="position:absolute"]')) { S.menu = false; render(); }
});
window.addEventListener("resize", render);
render();
</script>
</body>
</html>
