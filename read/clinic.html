<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>读片工作台 · 输入影像 → 区域定位 → 文献溯源</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="clinic.css">
<link rel="stylesheet" href="agent.css">
</head>
<body>

<header class="bar" data-page="clinic">
  <div class="bar-extra">
    <label class="search">
      <span>⌕</span>
      <input id="q" type="search" placeholder="病例编号 / 部位 / 模态 / 体位" autocomplete="off">
    </label>
    <div class="gate" id="gate">
      <span><i class="d dual"></i>双引用 <b id="gDual">0</b></span>
      <span><i class="d single"></i>单引用 <b id="gSingle">0</b></span>
      <span><i class="d broken"></i>拦截 <b id="gBroken">0</b></span>
    </div>
  </div>
</header>

<div class="shell">
  <aside class="list">
    <div class="list-head">
      <span>病例队列</span>
      <b id="listCount">0</b>
    </div>
    <div class="seg" id="levelSeg">
      <button data-l="" class="on">全部</button>
      <button data-l="B">B 已复核</button>
      <button data-l="C">C 待复核</button>
    </div>
    <div class="table-head">
      <span>编号</span><span>部位</span><span>分区</span><span>双引</span><span>等级</span>
    </div>
    <div class="rows" id="rows"><div class="empty-state"><span>加载中…</span></div></div>
    <div class="list-foot">
      <span>共 <b id="total">0</b> 例</span>
      <span>可定位 <b id="locatable">0</b></span>
    </div>
  </aside>

  <main class="work">
    <div class="work-head">
      <div>
        <h1 id="title">未选择病例</h1>
        <div class="sub" id="sub">—</div>
      </div>
      <div class="head-right">
        <span class="pill" id="posePill">—</span>
        <span class="pill" id="atlasPill">—</span>
      </div>
    </div>

    <div class="quest-strip">
      <div class="quest-steps">
        <span class="step on" id="stepCase"><i>1</i>选择影像</span>
        <span class="sep"></span>
        <span class="step" id="stepLocate"><i>2</i>区域定位</span>
        <span class="sep"></span>
        <span class="step" id="stepTrace"><i>3</i>双引用溯源</span>
      </div>
      <span class="spacer"></span>
      <span class="hint" id="flowHint">先选一例，或在工具栏上传本地影像</span>
    </div>

    <div class="stage" id="stage">
      <div class="frame" id="frame">
        <img id="img" alt="影像" draggable="false">
        <div class="overlay" id="overlay"></div>
        <div class="selbox" id="selbox"></div>
      </div>
      <div class="stage-empty" id="stageEmpty">
        <b>从左侧选一例，或在工具栏上传影像</b>
        <span>拖拽画框 → 命中解剖分区 → 右侧给出空间锚点与文献锚点</span>
      </div>
      <div class="zoom" id="zoomBadge">100%</div>
      <div class="toast" id="toast"></div>
    </div>

    <div class="tools">
      <div class="tg">
        <button class="btn sm" id="zoomOut">−</button>
        <button class="btn sm" id="zoomReset">100%</button>
        <button class="btn sm" id="zoomIn">+</button>
        <button class="btn sm" id="fit">适应</button>
        <button class="btn sm" id="uploadBtn" title="上传本地影像：仅本地服务可用">上传影像</button>
        <input id="fileInput" type="file" accept="image/*" hidden>
      </div>
      <div class="sep"></div>
      <div class="tg">
        <button class="btn sm on" id="regionToggle"><i></i>分区</button>
        <button class="btn sm" id="clear">清除</button>
      </div>
      <div class="sep"></div>
      <span class="hint" id="hint">拖框定位 · Shift+拖动平移 · 滚轮缩放</span>
      <span class="spacer"></span>
      <span class="mono" id="bboxMeta">—</span>
    </div>

    <div class="work-foot">
      <span id="srcLine">—</span>
      <span class="spacer"></span>
      <span id="licLine">—</span>
    </div>
  </main>

  <aside class="panel">
    <div class="tabs">
      <button data-t="locate" class="on">定位</button>
      <button data-t="chat">问答</button>
      <button data-t="evidence">双引用 <i id="evCount">0</i></button>
      <button data-t="audit">审计</button>
    </div>
    <div class="tab-body" id="tabBody"></div>
  </aside>
</div>

<script src="common.js"></script>
<script src="agent.js"></script>
<script src="static.js"></script>
<script src="locate.js"></script>
<script src="clinic.js"></script>
</body>
</html>
