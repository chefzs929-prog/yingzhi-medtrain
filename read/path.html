<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f7f6">
<title>今日任务 · RadioCheck</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230b4f55'/%3E%3Ctext x='32' y='44' font-size='36' text-anchor='middle' fill='white' font-family='sans-serif'%3ER%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f2f7f6; --surface:#fff; --ink:#0f2029; --ink2:#2a4350;
  --muted:#5f7784; --faint:#8ba0ab; --line:#e3eeeb;
  --brand:#0b4f55; --brand2:#0e7c7b;
  --ok:#147a5b; --warn:#a9690b; --bad:#b23b3b; --grey:#7c8f99;
  --r:14px; --shadow:0 1px 2px rgba(16,35,46,.05),0 14px 36px -30px rgba(11,79,85,.5);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#e9f1ef;color:var(--ink);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
.app{max-width:560px;margin:0 auto;min-height:100vh;background:var(--bg);padding:18px 16px 40px}
@media(min-width:600px){.app{min-height:calc(100vh - 40px);margin:20px auto;border-radius:26px;box-shadow:0 30px 80px -50px rgba(11,79,85,.6)}}

.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.back{width:34px;height:34px;border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center;font-size:17px;color:var(--brand)}
.top .t{font-size:15px;font-weight:700}
.top .s{font-size:11.5px;color:var(--faint)}

.hero{background:#fff;border-radius:18px;padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
.hero .k{font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--brand2);margin-bottom:6px}
.hero h1{font-size:21px;margin:0 0 6px;letter-spacing:-.01em}
.hero p{margin:0 0 14px;font-size:12.5px;color:var(--muted);line-height:1.7}
.hero .prog{display:flex;align-items:center;gap:10px}
.hero .bar{flex:1;height:6px;border-radius:99px;background:#e5efec;overflow:hidden}
.hero .bar i{display:block;height:100%;background:linear-gradient(90deg,#0e7c7b,#4fbf8b);border-radius:99px;transition:width .35s}
.hero .n{font-size:12px;font-weight:700;color:var(--brand);white-space:nowrap}
.hero .case{font-size:11.5px;color:var(--faint);margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.hero .case b{color:var(--ink2)}

.steps{background:#fff;border-radius:18px;padding:6px 0;box-shadow:var(--shadow);overflow:hidden}
.step{display:flex;gap:12px;padding:14px 16px 14px 16px;position:relative}
.step + .step{border-top:1px solid var(--line)}
.rail{display:flex;flex-direction:column;align-items:center;flex:0 0 auto;padding-top:1px}
.dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;
  background:#eef4f2;color:var(--faint);border:1px solid var(--line);flex:0 0 auto}
.step.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.step.now .dot{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 0 0 4px rgba(11,79,85,.10)}
.body{flex:1;min-width:0}
.st-h{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:650;flex-wrap:wrap}
.step.lock .st-h{color:var(--faint)}
.badge{font-size:10px;font-weight:700;padding:1px 7px;border-radius:99px;background:#e9f4f1;color:var(--brand2)}
.badge.ok{background:#e8f6ef;color:var(--ok)}
.badge.no{background:#fdf0f0;color:var(--bad)}
.st-p{font-size:11.5px;color:var(--muted);line-height:1.7;margin:3px 0 0}
.st-a{margin-top:9px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.go{display:inline-flex;align-items:center;gap:4px;height:31px;padding:0 14px;border-radius:99px;
  background:var(--brand);color:#fff;font-size:12px;font-weight:650;border:0;cursor:pointer}
.go.ghost{background:#f4f9f7;color:var(--brand2);border:1px solid var(--line)}
.go:active{transform:scale(.98)}

.summary{background:#fff;border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-top:16px}
.summary h3{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--faint);margin:0 0 10px}
.summary .empty{font-size:12.5px;color:var(--muted);line-height:1.8}
.sum-row{display:flex;gap:9px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line);font-size:12.5px;line-height:1.7}
.sum-row:last-child{border-bottom:0}
.sum-row .ic{flex:0 0 auto;width:18px;text-align:center;color:var(--brand2)}
.sum-row b{color:var(--ink2)}
.sum-row .hi{color:var(--bad);font-weight:650}
.sum-row .good{color:var(--ok);font-weight:650}

.finish{margin-top:16px;background:linear-gradient(150deg,#0b4f55,#0e7c7b);border-radius:18px;padding:18px;color:#fff;box-shadow:0 20px 40px -30px rgba(11,79,85,.9)}
.finish .fk{font-size:10.5px;font-weight:700;letter-spacing:.1em;opacity:.8}
.finish h2{font-size:18px;margin:6px 0 8px}
.finish p{font-size:12.5px;line-height:1.8;margin:0 0 14px;opacity:.92}
.finish .row{display:flex;gap:8px}
.finish a{flex:1;text-align:center;height:40px;line-height:40px;border-radius:11px;font-size:13px;font-weight:650;background:rgba(255,255,255,.16);color:#fff}
.finish a.primary{background:#fff;color:var(--brand)}

.dis{margin-top:16px;font-size:11px;color:var(--bad);background:#fdf6f6;border:1px solid #f3dcdc;border-radius:10px;padding:9px 11px;line-height:1.7}
</style>
<!-- rc-agent-base --><script>window.RC_AGENT_BASE='https://function-ultra-disclose-commissioners.trycloudflare.com';</script>
</head>
<body>
<div class="app">

  <div class="top">
    <a class="back" href="../index.html">‹</a>
    <div><div class="t">今日任务</div><div class="s" id="sub">一轮四步，走完就闭环</div></div>
  </div>

  <div class="hero">
    <div class="k">LEARNING PATH</div>
    <h1>看片 → 看证据 → 对照指南 → 补错题</h1>
    <p>四个页面共用同一例。第一步你判读，后面三步用同一张片回答「为什么」「差在哪」「补什么」。</p>
    <div class="prog">
      <div class="bar"><i id="hbar" style="width:0"></i></div>
      <div class="n" id="hn">0 / 4</div>
    </div>
    <div class="case" id="caseLine">正在选本轮病例…</div>
  </div>

  <div class="steps" id="steps"></div>

  <div class="summary">
    <h3>本轮小结</h3>
    <div id="sum"><div class="empty">走完至少一步，这里会汇总你的表现。</div></div>
  </div>

  <div id="finishBox"></div>

  <div class="dis">非诊断用途 · 学习路径只串联本项目已有页面，不改变各页面的判定逻辑</div>
</div>

<script>
const K_PATH = "rc_path_v1";
const K_DRILL = "rc_drill_v1";
const URL_READ = "../data/chest/chest_reading.json";
const URL_DUAL = "../data/chest/dual_source.json";

let READ = { cases: [] }, DUAL = { cases: [] };

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m])); }

function loadPath(){
  try{
    const s = JSON.parse(localStorage.getItem(K_PATH) || "null");
    if(s && s.steps) return s;
  }catch(e){}
  return { case: "", steps: {}, score: null, started: false };
}
function savePath(s){ try{ localStorage.setItem(K_PATH, JSON.stringify(s)); }catch(e){} }
function loadDrill(){
  try{ return JSON.parse(localStorage.getItem(K_DRILL) || "null") || { kp:{} }; }catch(e){ return { kp:{} }; }
}

/* 选一例：三个页面都能用的（有异常区 + 覆盖指南主题 + 有逐区报告） */
function pickCase(){
  const dualMap = {};
  (DUAL.cases||[]).forEach(c=> dualMap[c.case_id] = c);
  const ok = (READ.cases||[]).filter(c=>{
    if(!c.zones || !c.zones.length) return false;
    const hasAb = c.zones.some(z=>z.status === "abnormal");
    const d = dualMap[c.id];
    return hasAb && d && d.topic_id !== "UNMAPPED" && d.report_available;
  });
  if(!ok.length) return (READ.cases||[])[0] || null;
  return ok[Math.floor(Math.random()*ok.length)];
}

const STEP_DEF = [
  { n:1, title:"盲测读片", desc:"先不看答案，在影像上点出你认为异常的分区，然后揭晓。", href:"blind.html", act:"开始判读" },
  { n:2, title:"三方交叉检验", desc:"同一例，看模型、传统算法、库内标注三者是否互相打脸。", href:"evidence.html", act:"看证据" },
  { n:3, title:"报告—指南对照", desc:"同一例，看这份报告的要素覆盖，差在哪几项。", href:"dual.html", act:"对照指南" },
  { n:4, title:"错题复练", desc:"回到练习，系统按你刚才暴露的薄弱点继续出题。", href:"drill.html", act:"去练习" }
];

let P = loadPath();

function renderSteps(){
  const c = P.case || "—";
  const box = $("steps");
  const doneN = [1,2,3,4].filter(n=>P.steps[n]).length;
  const firstUndone = [1,2,3,4].find(n=>!P.steps[n]) || 0;

  box.innerHTML = STEP_DEF.map(d=>{
    const done = !!P.steps[d.n];
    const isNow = !done && d.n === firstUndone;
    const cls = done ? "done" : (isNow ? "now" : "");
    const q = P.case ? ("?case=" + encodeURIComponent(P.case)) : "";
    let badge = "";
    if(d.n === 1 && P.score != null) badge = `<span class="badge ${P.score >= 60 ? "ok" : "no"}">得分 ${P.score}</span>`;
    if(d.n === 2 && done) badge = `<span class="badge ok">已看</span>`;
    if(d.n === 3 && done) badge = `<span class="badge ok">已看</span>`;
    if(d.n === 4 && done) badge = `<span class="badge ok">已练</span>`;
    const href = d.n === 1 ? d.href + q : (d.n === 4 ? d.href : d.href + q);
    return `
      <div class="step ${cls}">
        <div class="rail"><span class="dot">${done ? "✓" : d.n}</span></div>
        <div class="body">
          <div class="st-h">${d.title} ${badge}</div>
          <div class="st-p">${d.desc}</div>
          <div class="st-a">
            <a class="go ${done ? "ghost" : ""}" href="${href}">${done ? "重做" : d.act}</a>
          </div>
        </div>
      </div>`;
  }).join("");

  const pct = Math.round(doneN/4*100);
  $("hbar").style.width = pct + "%";
  $("hn").textContent = `${doneN} / 4`;
  $("sub").textContent = doneN === 4 ? "本轮已闭环" : `还差 ${4 - doneN} 步`;
  $("caseLine").innerHTML = P.case
    ? `本轮病例 <b>${esc(P.case)}</b>　·　四步共用同一例`
    : "正在选本轮病例…";
  return doneN;
}

function renderSummary(doneN){
  const box = $("sum");
  const rows = [];

  if(P.steps[1]){
    const c = (READ.cases||[]).find(x=>x.id === P.case);
    const ab = c ? c.zones.filter(z=>z.status === "abnormal").length : 0;
    rows.push({
      ic:"①",
      html: P.score != null
        ? `盲测得分 <b>${P.score}</b>${P.score >= 60 ? '，<span class="good">判读基本到位</span>' : '，<span class="hi">漏报或误报较多</span>'}。`
        : "已完成盲测判读。",
      tip: ab ? `该例库内标注 ${ab} 个异常区。` : ""
    });
  }

  if(P.steps[2]){
    const d = (DUAL.cases||[]).find(x=>x.case_id === P.case);
    rows.push({ ic:"②", html:"已看过同一例的三方交叉检验。算法分歧不隐瞒，也不合并。", tip:"" });
  }

  if(P.steps[3]){
    const d = (DUAL.cases||[]).find(x=>x.case_id === P.case);
    if(d && d.elements){
      const miss = d.elements.filter(e=>!e.covered).map(e=>e.label);
      rows.push({
        ic:"③",
        html: `报告要素覆盖 <b>${Math.round((d.coverage||0)*100)}%</b>${miss.length ? `，缺 <span class="hi">${miss.join("、")}</span>` : '，<span class="good">要素齐全</span>'}。`,
        tip: miss.length ? "缺项即规范报告要补的内容。" : ""
      });
    }
  }

  if(P.steps[4]){
    const dl = loadDrill();
    const kps = Object.entries(dl.kp || {}).filter(([,v])=>v && v.n);
    const weak = kps.filter(([,v])=>v.wrong > 0).sort((a,b)=>b[1].wrong - a[1].wrong);
    if(weak.length){
      const top = weak.slice(0,2).map(([k,v])=>{
        const name = (dl.kps||[]).find(x=>x.kp===k);
        return name ? name.kp_cn : k;
      });
      rows.push({ ic:"④", html:`练习暴露薄弱点：<span class="hi">${top.join("、")}</span>。`, tip:"「去练」可定向复练这些知识点。" });
    } else {
      rows.push({ ic:"④", html:'练习暂无错题，<span class="good">当前知识点掌握良好</span>。', tip:"" });
    }
  }

  if(!rows.length){
    box.innerHTML = `<div class="empty">走完至少一步，这里会汇总你的表现。</div>`;
    return;
  }
  box.innerHTML = rows.map(r=>
    `<div class="sum-row"><span class="ic">${r.ic}</span><div>${r.html}${r.tip ? `<div style="color:var(--faint);font-size:11.5px;margin-top:1px">${r.tip}</div>` : ""}</div></div>`
  ).join("");
}

function renderFinish(doneN){
  const box = $("finishBox");
  if(doneN < 4){ box.innerHTML = ""; return; }
  const q = P.case ? ("?case=" + encodeURIComponent(P.case)) : "";
  box.innerHTML = `
    <div class="finish">
      <div class="fk">ROUND COMPLETE</div>
      <h2>这一轮走完了</h2>
      <p>你完成了一次完整闭环：先判断，再看证据，再对照规范，最后把薄弱点补回来。换一例重走，或者直接进练习。</p>
      <div class="row">
        <a href="path.html" id="again">换一例重走</a>
        <a class="primary" href="drill.html">继续练习</a>
      </div>
    </div>`;
  const again = $("again");
  if(again) again.onclick = (e)=>{
    e.preventDefault();
    const nc = pickCase();
    P = { case: nc ? nc.id : "", steps:{}, score:null, started:true };
    savePath(P);
    location.reload();
  };
}

function boot(){
  Promise.all([
    fetch(URL_READ, {cache:"no-cache"}).then(r=>r.json()),
    fetch(URL_DUAL, {cache:"no-cache"}).then(r=>r.json())
  ]).then(([read, dual])=>{
    READ = read; DUAL = dual;

    if(!P.case){
      const c = pickCase();
      P.case = c ? c.id : "";
      P.started = true;
      savePath(P);
    }
    const doneN = renderSteps();
    renderSummary(doneN);
    renderFinish(doneN);
  }).catch(e=>{
    $("caseLine").textContent = "数据未加载：请通过构建后的站点访问 read/path.html";
    console.error(e);
  });
}
boot();
</script>
</body>
</html>
