<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>影像教学 · 分区读片</title>
<link rel="stylesheet" href="/teach.css">
</head>
<body>

<header class="top">
  <div class="brand">
    <span class="glyph">◧</span>
    <div>
      <h1>分区读片</h1>
      <p>影像教学 · 区域定位与文献对照</p>
    </div>
  </div>

  <div class="progress" title="已学病例">
    <div class="pbar"><i id="pfill"></i></div>
    <span id="ptext">0 / 120</span>
  </div>

  <nav class="switch">
    <a class="on" href="/teach">教学</a>
    <a href="/clinic">临床</a>
    <a href="/paper">组卷</a>
  </nav>
</header>

<div class="shell">
  <aside class="rail">
    <div class="rail-head">
      <span>课程章节</span>
      <b id="chCount">—</b>
    </div>
    <div id="chapters" class="chapters"><div class="loading">加载中…</div></div>

    <div class="rail-head sub">
      <span id="caseHead">病例</span>
      <input id="q" type="search" placeholder="筛选" autocomplete="off">
    </div>
    <div id="cases" class="cases"></div>
  </aside>

  <main class="stage">
    <div class="stage-head">
      <div>
        <h2 id="caseTitle">选择左侧病例开始</h2>
        <div class="meta" id="caseMeta"></div>
      </div>
      <div class="badges" id="caseBadges"></div>
    </div>

    <div class="canvas" id="canvas">
      <div class="frame" id="frame">
        <img id="img" alt="影像" draggable="false">
        <div class="overlay" id="overlay"></div>
      </div>
      <div class="empty" id="empty">
        <div class="ico">◧</div>
        <b>从左侧选一个病例</b>
        <span>点击影像上的彩色分区，右侧会给出解剖边界与文献对照</span>
      </div>
      <div class="hint" id="hint"></div>
    </div>

    <div class="stage-foot">
      <button id="prev" class="ghost">← 上一例</button>
      <button id="toggleRegion" class="ghost on">分区显示</button>
      <button id="quizBtn" class="solid">开始自测</button>
      <button id="learnBtn" class="ghost">标记已学</button>
      <span class="spacer"></span>
      <span id="srcLine" class="src">—</span>
      <button id="next" class="ghost">下一例 →</button>
    </div>
  </main>

  <aside class="lesson">
    <div class="lesson-head">
      <span class="kicker">讲解卡</span>
      <span class="side-tag" id="sideTag">—</span>
    </div>

    <div class="lesson-body" id="lessonBody">
      <div class="placeholder">
        <b>选择一个分区</b>
        <p>分区不是病灶检测结果，而是教学用的解剖范围。每条讲解都带来源摘录。</p>
      </div>
    </div>

    <div class="disclaimer">
      本工具仅用于教学与研究，不构成诊断意见，不能替代医师判断。
    </div>
  </aside>
</div>

<!-- 自测浮层 -->
<div class="quiz" id="quiz">
  <div class="quiz-card">
    <div class="qhead">
      <span>随堂自测</span>
      <button id="qClose">×</button>
    </div>
    <div class="qbody" id="qBody"></div>
  </div>
</div>

<script src="/teach.js"></script>
</body>
</html>
