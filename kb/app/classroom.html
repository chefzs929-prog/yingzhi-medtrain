<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>课堂 · 教师与学生 · RadioCheck</title>
<meta name="theme-color" content="#0b4f55">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon-180.png">
<link rel="stylesheet" href="base.css?v=10">
<link rel="stylesheet" href="classroom.css?v=10">
</head>
<body>

<header class="bar" data-page="classroom">
  <div class="bar-extra">
    <span class="quest-badge">课堂 · 教师 / 学生</span>
    <span class="bar-note" id="barNote">班级与答题记录只存在本机浏览器</span>
    <span class="spacer"></span>
    <button class="btn sm" id="exportClassroom" title="导出本机课堂数据 JSON">导出数据</button>
    <label class="btn sm" for="importClassroom" title="导入另一台设备的课堂数据">导入数据</label>
    <input id="importClassroom" type="file" accept="application/json" hidden>
    <div class="role-switch" id="roleSwitch" aria-label="角色切换">
      <button data-role="teacher">教师端</button>
      <button data-role="student">学生端</button>
    </div>
  </div>
</header>

<div class="global-disclaimer"><b>非诊断用途</b><span>仅用于医学影像教学与研究，不构成诊断意见，不替代临床决策；分数只代表与库内标注的匹配度。</span></div>

<main class="class-shell">
  <div class="class-wrap" id="classroomMain">
    <div class="empty-state"><b>正在载入课堂…</b></div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script src="common.js?v=10"></script>
<script src="classroom-core.js?v=10"></script>
<script src="student-lab.js?v=10"></script>
<script src="classroom.js?v=10"></script>
<script src="agent-lite.js?v=1"></script>
</body>
</html>
