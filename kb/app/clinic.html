<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>胸片阅片工作台 · 选片 → 分区 → 所见与出处</title>
<meta name="theme-color" content="#0b4f55">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon-180.png">
<link rel="stylesheet" href="base.css?v=7">
<link rel="stylesheet" href="clinic.css?v=7">
</head>
<body>

<header class="bar" data-page="clinic">
  <div class="bar-extra">
    <span class="quest-badge">赛道 B · 胸片阅片</span>
    <span class="bar-note" id="barNote">CR 胸部 · 21 例逐区校正</span>
    <span class="spacer"></span>
    <label class="search">
      <span>⌕</span>
      <input id="q" type="search" placeholder="病例编号 / 标题 / 征象" autocomplete="off">
    </label>
  </div>
</header>

<div class="chest-shell">
  <aside class="queue">
    <div class="queue-head">
      <div>
        <b>胸片病例</b>
        <span>CR · 胸部</span>
      </div>
      <em id="queueCount">0</em>
    </div>
    <div class="queue-filter" id="filters">
      <button data-f="all" class="on">全部</button>
      <button data-f="normal">正常</button>
      <button data-f="airspace">气腔影</button>
      <button data-f="pneumothorax">气胸</button>
      <button data-f="effusion">积液</button>
      <button data-f="tb">结核</button>
      <button data-f="nodule">结节</button>
    </div>
    <div class="queue-list" id="queueList">
      <div class="empty-state">正在载入胸片数据…</div>
    </div>
    <div class="queue-foot">
      <span>仅 CR 胸部</span>
      <span>未入库影像不推断</span>
    </div>
  </aside>

  <main class="viewer">
    <div class="case-head">
      <div class="ch-l">
        <div class="ch-kicker"><span id="caseId">—</span><span id="casePose">—</span></div>
        <h1 id="caseTitle">正在载入…</h1>
        <div class="ch-meta" id="caseMeta">—</div>
      </div>
      <div class="ch-r">
        <span class="quality" id="caseQuality">—</span>
        <a class="src-link" id="caseSource" href="#" target="_blank" rel="noopener">来源 ↗</a>
      </div>
    </div>

    <div class="chain">
      <span class="step on" id="step1"><i>1</i>选片</span>
      <span class="sep"></span>
      <span class="step" id="step2"><i>2</i>点分区 / 拖框</span>
      <span class="sep"></span>
      <span class="step" id="step3"><i>3</i>看所见与出处</span>
      <span class="spacer"></span>
      <span class="chain-hint" id="chainHint">点影像上的彩色分区，或直接提问</span>
    </div>

    <div class="stage" id="stage">
      <div class="frame" id="frame">
        <img id="img" alt="胸片" draggable="false">
        <div class="zones" id="zones"></div>
        <div class="selbox" id="selbox" hidden></div>
      </div>
      <div class="stage-empty" id="stageEmpty">
        <b>正在载入胸片…</b>
        <span>如果长时间没有影像，请检查 data/chest/chest_reading.json 是否存在。</span>
      </div>
      <div class="zoom-badge" id="zoomBadge">100%</div>
      <div class="legend" id="legend">
        <span><i class="lg normal"></i>未见异常</span>
        <span><i class="lg abnormal"></i>异常</span>
        <span><i class="lg unmentioned"></i>来源未提及</span>
        <span><i class="lg limited"></i>判读受限</span>
      </div>
    </div>

    <div class="viewer-tools">
      <div class="tg">
        <button class="btn sm on" id="zoneToggle">分区</button>
        <button class="btn sm" id="fitBtn">适应</button>
        <button class="btn sm" id="zoomOut">−</button>
        <button class="btn sm" id="zoomIn">+</button>
      </div>
      <span class="sep"></span>
      <label class="btn sm" for="fileInput">上传胸片</label>
      <input id="fileInput" type="file" accept="image/*" hidden>
      <button class="btn sm" id="reportBtn">生成阅片记录</button>
      <span class="spacer"></span>
      <span class="mono hint" id="bboxMeta">—</span>
    </div>

    <div class="viewer-foot">
      <span id="srcLine">—</span>
      <span class="spacer"></span>
      <span id="licLine">—</span>
    </div>
  </main>

  <aside class="panel">
    <div class="tabs" id="tabs">
      <button data-tab="zone" class="on">分区所见</button>
      <button data-tab="system">系统阅片</button>
      <button data-tab="qa">问答</button>
      <button data-tab="source">出处</button>
    </div>
    <div class="panel-body" id="panelBody"></div>
    <div class="panel-foot">
      <span>教学分区，不是病灶分割</span>
      <span>非诊断用途</span>
    </div>
  </aside>
</div>

<div class="report-mask" id="reportMask" hidden>
  <div class="report-box" role="dialog" aria-modal="true" aria-label="胸片阅片记录">
    <div class="report-head">
      <div>
        <b>胸片阅片记录</b>
        <span>教学用 · 非诊断</span>
      </div>
      <button class="btn sm" id="reportClose">关闭</button>
    </div>
    <pre id="reportText"></pre>
    <div class="report-foot">
      <span>记录只复述公开来源、原图标注与本库人工校正。</span>
      <span class="spacer"></span>
      <button class="btn sm" id="reportCopy">复制</button>
      <button class="btn sm primary" id="reportDownload">下载 .txt</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="common.js?v=7"></script>
<script src="locate.js?v=7"></script>
<script src="clinic.js?v=7"></script>
</body>
</html>
