<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>影像双引用知识库 · 选择场景</title>
<style>
  :root{
    --bg:#f6f1e8;--surface:#fffdf8;--ink:#24302b;--muted:#7b837a;
    --accent:#2f5d4f;--clay:#b5643c;--line:#e4ddd1;
    --serif:"Songti SC","Noto Serif SC",Georgia,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:48px 24px;gap:36px}
  header{text-align:center}
  .mark{width:46px;height:46px;border-radius:13px;background:var(--accent);color:#fff;
    display:grid;place-items:center;font-size:21px;margin:0 auto 18px}
  h1{font-family:var(--serif);font-size:27px;font-weight:600;letter-spacing:.04em}
  header p{font-size:13px;color:var(--muted);margin-top:9px;line-height:1.7}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:20px;width:min(860px,100%)}
  a.card{display:block;text-decoration:none;color:inherit;background:var(--surface);
    border:1px solid var(--line);border-radius:20px;padding:30px 28px;
    transition:.2s;position:relative;overflow:hidden}
  a.card:hover{transform:translateY(-3px);box-shadow:0 18px 40px rgba(36,48,43,.10);
    border-color:#d3c9b8}
  .tag{font-size:10px;letter-spacing:.16em;color:var(--muted);margin-bottom:14px}
  .card h2{font-family:var(--serif);font-size:22px;font-weight:600;margin-bottom:9px}
  .card p{font-size:12.5px;line-height:1.8;color:#5c675f;min-height:66px}
  .feat{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
  .feat span{font-size:10.5px;padding:3px 9px;border-radius:20px;
    background:#f1ece1;color:#6b756c}
  .go{margin-top:22px;font-size:12px;color:var(--accent);display:flex;align-items:center;gap:6px}
  a.card.clinic{background:#111a21;border-color:#22303c;color:#dfe8ef}
  .clinic .tag{color:#7c8b98}
  .clinic p{color:#9fb0bd}
  .clinic .feat span{background:#1b2833;color:#8fa2b0}
  .clinic .go{color:#4ec9b0}
  .clinic h2{color:#eaf2f8}
  footer{font-size:11px;color:var(--muted);text-align:center;line-height:1.8;max-width:620px}
  .stats{display:flex;gap:26px;justify-content:center;margin-top:6px}
  .stats div{text-align:center}
  .stats b{display:block;font-family:var(--serif);font-size:20px;color:var(--accent)}
  .stats span{font-size:10.5px;color:var(--muted)}
  @media(max-width:760px){.cards{grid-template-columns:1fr}}
</style>
</head>
<body>

<header>
  <div class="mark">◫</div>
  <h1>影像双引用知识库</h1>
  <p>120 例常用影像 · 区域定位 + 文献溯源<br>同一套数据，两种使用方式</p>
</header>

<div class="cards">
  <a class="card" href="/teach">
    <div class="tag">TEACHING</div>
    <h2>教学版 · 分区读片</h2>
    <p>按章节循序学习：点分区看解剖边界，对照库内征象与文献摘录，随堂自测检验掌握程度。</p>
    <div class="feat"><span>章节树</span><span>讲解卡</span><span>自测</span><span>学习进度</span></div>
    <div class="go">进入教学版 →</div>
  </a>

  <a class="card clinic" href="/clinic">
    <div class="tag">CLINICAL</div>
    <h2>临床版 · 证据核验</h2>
    <p>按队列快速检索：拖框命中分区，逐项核对空间锚点与文献锚点，查看哈希校验与全量审计。</p>
    <div class="feat"><span>框选定位</span><span>双锚点</span><span>证据等级</span><span>审计</span></div>
    <div class="go">进入临床版 →</div>
  </a>
</div>

<div class="stats">
  <div><b id="s1">120</b><span>例影像</span></div>
  <div><b id="s2">—</b><span>个分区</span></div>
  <div><b id="s3">—</b><span>条双引用</span></div>
  <div><b id="s4">—</b><span>套体位模板</span></div>
</div>

<footer>
  分区为教学用解剖范围，不是病灶检测结果。本知识库仅用于教学与研究，不构成诊断意见。
</footer>

<script>
fetch('/api/meta').then(r=>r.json()).then(m=>{
  document.getElementById('s1').textContent=m.counts.cases;
  document.getElementById('s2').textContent=m.counts.regions;
  document.getElementById('s3').textContent=m.gate.dual;
  document.getElementById('s4').textContent=m.counts.atlases;
}).catch(()=>{});
</script>
</body>
</html>
