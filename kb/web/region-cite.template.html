<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>影像区域定位 · 文献溯源双引用</title>
<style>
:root{
  --bg:#0a0e14; --panel:#111823; --panel2:#0d131c; --line:#1e2a38;
  --txt:#e6edf3; --dim:#8b98a5; --dim2:#5f6c7b;
  --accent:#2dd4bf; --accent-dim:#134e4a;
  --green:#3fb950; --amber:#e3a008; --red:#f2555a; --blue:#58a6ff;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:13px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* ---------- header ---------- */
header{
  display:flex;align-items:center;gap:16px;
  padding:10px 18px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#101823,#0b1118);
  position:sticky;top:0;z-index:30;
}
.brand{display:flex;align-items:baseline;gap:9px;white-space:nowrap}
.brand b{font-size:14px;font-weight:650;letter-spacing:.2px}
.brand span{font-size:11px;color:var(--dim2);letter-spacing:.4px}
.seg{display:flex;gap:2px;background:#0a0f16;border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{
  padding:5px 11px;border-radius:6px;color:var(--dim);font-size:12px;
  transition:.15s;white-space:nowrap;
}
.seg button:hover{color:var(--txt);background:#151d28}
.seg button.on{background:var(--accent-dim);color:#7ff0e2;box-shadow:inset 0 0 0 1px #1d6f68}
.spacer{flex:1}
.toggle{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:12px;cursor:pointer;user-select:none}
.toggle input{accent-color:var(--accent);width:13px;height:13px;cursor:pointer}

/* ---------- layout ---------- */
main{
  display:grid;grid-template-columns:minmax(0,1.5fr) minmax(380px,1fr);
  gap:14px;padding:14px 18px 18px;align-items:start;
}
@media (max-width:1100px){ main{grid-template-columns:1fr} }

.card{background:var(--panel);border:1px solid var(--line);border-radius:10px}

/* ---------- viewer ---------- */
.viewer{padding:0;overflow:hidden;position:relative}
.vhead{
  display:flex;align-items:center;gap:10px;padding:9px 13px;
  border-bottom:1px solid var(--line);background:var(--panel2);
}
.vhead .t{font-weight:600;font-size:13px}
.chip{
  font-size:10.5px;padding:2px 7px;border-radius:5px;
  background:#182231;color:var(--dim);border:1px solid #22303f;white-space:nowrap;
}
.chip.global{color:#7ff0e2;background:#0f2b28;border-color:#1d5c56}
.chip.local{color:#f0c674;background:#2b230f;border-color:#5c4a1d}
.stage{
  position:relative;display:flex;align-items:center;justify-content:center;
  padding:12px;background:
    radial-gradient(circle at 50% 40%,#0e1620 0%,#080c12 70%);
  min-height:420px;
}
.frame{position:relative;display:inline-block;line-height:0;max-width:100%}
.frame img{
  display:block;max-width:100%;max-height:calc(100vh - 268px);
  width:auto;height:auto;border-radius:4px;
  box-shadow:0 8px 40px rgba(0,0,0,.6);
}
.overlay{position:absolute;inset:0;cursor:crosshair;user-select:none}

.region{
  position:absolute;border:1px dashed rgba(45,212,191,.46);
  border-radius:2px;transition:background .12s,border-color .12s;
  pointer-events:none;
}
.region .rlabel{
  position:absolute;left:3px;top:2px;font-size:9.5px;line-height:1.3;
  color:rgba(160,255,244,.92);background:rgba(6,12,18,.86);
  padding:0 3px;border-radius:3px;white-space:nowrap;
}
.region.hot{background:rgba(45,212,191,.13);border-color:rgba(45,212,191,.9)}
.region.hot .rlabel{color:#b8fff5}
.region.hit{background:rgba(45,212,191,.20);border-color:var(--accent);border-style:solid}
.region.dimmed{border-color:rgba(45,212,191,.12)}
.regions-off .region{display:none}

.selbox{
  position:absolute;border:1.5px solid var(--accent);
  background:rgba(45,212,191,.10);border-radius:2px;
  box-shadow:0 0 0 1px rgba(0,0,0,.5), 0 0 18px rgba(45,212,191,.25);
  pointer-events:none;
}
.selbox .sz{
  position:absolute;right:-1px;bottom:-19px;font-size:9.5px;
  background:var(--accent);color:#04211d;padding:0 5px;border-radius:3px;
  white-space:nowrap;font-weight:600;
}
.highlight{
  position:absolute;border:2px solid var(--amber);
  background:rgba(227,160,8,.14);border-radius:2px;
  box-shadow:0 0 20px rgba(227,160,8,.35);pointer-events:none;
  animation:pulse 1.6s ease-in-out infinite;
}
@keyframes pulse{0%,100%{box-shadow:0 0 16px rgba(227,160,8,.25)}50%{box-shadow:0 0 26px rgba(227,160,8,.55)}}
.hint{
  position:absolute;left:50%;bottom:10px;transform:translateX(-50%);
  font-size:11px;color:var(--dim2);background:rgba(8,12,18,.85);
  padding:3px 10px;border-radius:20px;white-space:nowrap;
  border:1px solid var(--line);pointer-events:none;
}
.vfoot{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:7px 13px;border-top:1px solid var(--line);
  background:var(--panel2);font-size:11px;color:var(--dim2);
}
.vfoot a{color:var(--dim);text-decoration:none;border-bottom:1px dotted #33414f}
.vfoot a:hover{color:var(--accent)}
.notice{
  display:flex;gap:7px;align-items:flex-start;
  margin:0;padding:8px 13px;font-size:11.5px;color:#f0c674;
  background:#1a1608;border-bottom:1px solid #332a10;
}
.notice.hide{display:none}

/* ---------- right panel ---------- */
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.phead{
  display:flex;align-items:center;gap:8px;
  padding:9px 13px;border-bottom:1px solid var(--line);background:var(--panel2);
}
.phead h3{margin:0;font-size:12px;font-weight:600;letter-spacing:.3px}
.phead .n{font-size:11px;color:var(--dim2)}

.empty{
  padding:34px 20px;text-align:center;color:var(--dim2);font-size:12px;
}
.empty b{display:block;color:var(--dim);font-weight:500;margin-bottom:6px;font-size:12.5px}

/* locate card */
.locate{padding:12px 13px}
.lrow{display:flex;gap:9px;padding:6px 0;border-bottom:1px dashed #18222e;font-size:12px}
.lrow:last-child{border-bottom:none}
.lrow .k{color:var(--dim2);width:70px;flex:none;font-size:11.5px;padding-top:1px}
.lrow .v{flex:1;min-width:0}
.lrow .v b{font-weight:600}
.side-badge{
  display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:4px;
  margin-left:5px;vertical-align:1px;
}
.side-r{background:#2a1416;color:#ff9b9e;border:1px solid #5c2226}
.side-l{background:#0f1d2b;color:#8cc6ff;border:1px solid #1f3f5c}
.side-m{background:#1a1f26;color:var(--dim);border:1px solid #2a3441}
.meter{height:4px;background:#182231;border-radius:2px;overflow:hidden;margin-top:5px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,#2dd4bf,#3fb950);border-radius:2px}
.warnline{
  margin-top:8px;padding:6px 9px;border-radius:6px;font-size:11.5px;
  background:#2b230f;border:1px solid #5c4a1d;color:#f0c674;
}
.warnline.red{background:#2a1416;border-color:#5c2226;color:#ff9b9e}
.tagrow{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.tag{
  font-size:10.5px;padding:1px 6px;border-radius:4px;
  background:#151f2b;border:1px solid #22303f;color:#a9b8c6;white-space:nowrap;
}

/* gate bar */
.gate{
  display:flex;align-items:center;gap:10px;padding:8px 13px;
  border-bottom:1px solid var(--line);background:#0c1219;font-size:11px;flex-wrap:wrap;
}
.gate .g{display:flex;align-items:center;gap:4px;color:var(--dim)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.dot.dual{background:var(--green);box-shadow:0 0 6px rgba(63,185,80,.7)}
.dot.single{background:var(--amber)}
.dot.broken{background:var(--red)}

/* claims */
.claims{padding:10px 11px;display:flex;flex-direction:column;gap:9px;max-height:44vh;overflow:auto}
.claims::-webkit-scrollbar{width:8px}
.claims::-webkit-scrollbar-thumb{background:#22303f;border-radius:4px}
.claim{
  border:1px solid var(--line);border-radius:8px;padding:9px 10px;
  background:#0f151d;position:relative;transition:.15s;
}
.claim:hover{border-color:#2c3d4f;background:#111925}
.claim .ctext{font-size:12.5px;line-height:1.65;color:#dbe5ee}
.claim .cmeta{
  display:flex;align-items:center;gap:6px;margin-top:7px;flex-wrap:wrap;
}
.st{
  font-size:9.5px;padding:1px 6px;border-radius:4px;font-weight:600;
  letter-spacing:.3px;text-transform:uppercase;
}
.st.dual{background:#0f2b18;color:#5fd47a;border:1px solid #1f5c30}
.st.single{background:#2b230f;color:#f0c674;border:1px solid #5c4a1d}
.st.broken{background:#2a1416;color:#ff9b9e;border:1px solid #5c2226}
.cite{
  display:inline-flex;align-items:center;gap:5px;
  font-size:11px;padding:3px 8px;border-radius:5px;
  border:1px solid #22303f;background:#131c26;color:#b8c6d3;
  transition:.14s;max-width:100%;
}
.cite:hover{border-color:var(--accent);color:#b8fff5;background:#0f2422}
.cite .ic{font-size:10px;opacity:.85}
.cite .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cite.sp{border-color:#2a4a6b;color:#a8cdf0}
.cite.sp:hover{border-color:var(--blue);color:#cfe6ff;background:#0f1c2b}
.cite.dc{border-color:#5c4a1d;color:#e8cf94}
.cite.dc:hover{border-color:var(--amber);color:#ffe6ae;background:#241d0c}
.cite.off{opacity:.4;pointer-events:none;text-decoration:line-through}
.cnote{margin-top:7px;font-size:11px;color:var(--dim2);line-height:1.55}
.cnote.red{color:#ff9b9e}
.cnote.amber{color:#d9b45e}
.claim.blocked{opacity:.72;border-style:dashed}
.claim.blocked .ctext{color:#9aa7b4}

/* drawer */
.drawer{
  position:fixed;top:0;right:0;height:100vh;width:min(460px,92vw);
  background:#0d141d;border-left:1px solid #243244;
  box-shadow:-24px 0 60px rgba(0,0,0,.6);
  transform:translateX(102%);transition:transform .24s cubic-bezier(.4,0,.2,1);
  z-index:50;display:flex;flex-direction:column;
}
.drawer.open{transform:translateX(0)}
.dhead{
  display:flex;align-items:flex-start;gap:10px;padding:14px 16px;
  border-bottom:1px solid var(--line);
}
.dhead .dt{font-size:13.5px;font-weight:600;line-height:1.45}
.dhead .ds{font-size:11px;color:var(--dim2);margin-top:3px}
.dclose{margin-left:auto;color:var(--dim2);font-size:18px;line-height:1;padding:2px 6px;border-radius:5px}
.dclose:hover{background:#1a2431;color:var(--txt)}
.dbody{padding:14px 16px;overflow:auto;flex:1}
.dsec{margin-bottom:16px}
.dsec .k{
  font-size:10.5px;color:var(--dim2);letter-spacing:.6px;
  text-transform:uppercase;margin-bottom:5px;
}
.dsec .v{font-size:12.5px;color:#cfdae5;line-height:1.65}
.excerpt{
  background:#0a1017;border:1px solid #1b2735;border-left:2px solid var(--amber);
  border-radius:5px;padding:10px 12px;font-size:12.5px;line-height:1.75;
  color:#e8dcc0;white-space:pre-wrap;
}
.excerpt.bad{border-left-color:var(--red);color:#ffc9cb}
.kv{display:grid;grid-template-columns:78px 1fr;gap:4px 10px;font-size:11.5px}
.kv .k{color:var(--dim2)}
.kv .v{color:#b8c6d3;word-break:break-all}
.ver{
  display:flex;align-items:center;gap:7px;padding:8px 10px;border-radius:6px;
  font-size:11.5px;margin-bottom:14px;
}
.ver.ok{background:#0f2b18;border:1px solid #1f5c30;color:#7ede95}
.ver.bad{background:#2a1416;border:1px solid #5c2226;color:#ffb3b5}
.ver.warn{background:#2b230f;border:1px solid #5c4a1d;color:#f0c674}
.dlink{
  display:inline-flex;align-items:center;gap:6px;font-size:11.5px;
  color:var(--blue);text-decoration:none;border-bottom:1px dotted #2a4a6b;
  word-break:break-all;
}
.dlink:hover{color:#9dd0ff}
.legs{
  display:flex;gap:0;align-items:stretch;margin-bottom:14px;
  background:#0a1017;border:1px solid #1b2735;border-radius:7px;overflow:hidden;
}
.leg{flex:1;padding:8px 10px;font-size:10.5px;line-height:1.5}
.leg .lh{color:var(--dim2);font-size:9.5px;letter-spacing:.5px;margin-bottom:2px}
.leg .lv{color:#cfdae5}
.leg.sp{border-right:1px solid #1b2735}

/* footer */
footer{
  padding:9px 18px 16px;color:var(--dim2);font-size:11px;
  display:flex;gap:10px;align-items:center;flex-wrap:wrap;
}
footer .sep{width:1px;height:11px;background:#22303f}
</style>
</head>
<body>

<header>
  <div class="brand"><b>影像区域定位</b><span>·</span><span>文献溯源双引用</span></div>
  <div class="seg" id="imgTabs"></div>
  <div class="spacer"></div>
  <label class="toggle"><input type="checkbox" id="showRegions" checked> 显示分区</label>
  <label class="toggle"><input type="checkbox" id="syncMode"> 并排核验</label>
</header>

<main>
  <section class="card viewer">
    <div class="vhead">
      <span class="t" id="vTitle">—</span>
      <span class="chip" id="vAtlas">—</span>
      <span class="spacer" style="flex:1"></span>
      <span class="chip" id="vLevel">—</span>
    </div>
    <div class="notice hide" id="vNotice"></div>
    <div class="stage">
      <div class="frame" id="frame">
        <img id="img" alt="影像">
        <div class="overlay" id="overlay"></div>
      </div>
      <div class="hint" id="hint">在影像上拖出一个矩形，定位解剖分区</div>
    </div>
    <div class="vfoot">
      <span id="vSource">—</span>
      <span class="sep" style="width:1px;height:10px;background:#22303f"></span>
      <span id="vLicense">—</span>
      <span class="spacer" style="flex:1"></span>
      <span class="mono" id="vCoord" style="color:#3f4c5a">—</span>
    </div>
  </section>

  <aside class="side">
    <div class="card">
      <div class="phead"><h3>定位结果</h3><span class="spacer" style="flex:1"></span><span class="n" id="locateMeta">未框选</span></div>
      <div id="locateBox"><div class="empty"><b>等待框选</b>拖框定位解剖分区，或单击图上任一点</div></div>
    </div>

    <div class="card">
      <div class="phead"><h3>双引用结论</h3><span class="spacer" style="flex:1"></span><span class="n" id="claimMeta">—</span></div>
      <div class="gate" id="gateBar">
        <span class="g"><i class="dot dual"></i>双引用 <b class="mono" id="gDual">0</b></span>
        <span class="g"><i class="dot single"></i>单引用 <b class="mono" id="gSingle">0</b></span>
        <span class="g"><i class="dot broken"></i>已拦截 <b class="mono" id="gBroken">0</b></span>
      </div>
      <div class="claims" id="claims"><div class="empty">定位后显示该分区的可对照条目</div></div>
    </div>
  </aside>
</main>

<footer>
  <span>仅用于教学与研究，不构成诊断意见，不能替代医师判断。</span>
  <span class="sep"></span>
  <span>分区为人工标注的解剖区域，非病灶检测结果。</span>
  <span class="sep"></span>
  <span>引用均带空间锚点与文献锚点，可逐条核验。</span>
</footer>

<div class="drawer" id="drawer">
  <div class="dhead">
    <div>
      <div class="dt" id="dTitle">—</div>
      <div class="ds" id="dSub">—</div>
    </div>
    <button class="dclose" id="dClose">×</button>
  </div>
  <div class="dbody" id="dBody"></div>
</div>

<script>
/* ============================================================
   数据层：真实影像 + 真实条款（取自 kb/data）
   分区坐标为归一化 [x,y,w,h]，人工按解剖比例估计
   ============================================================ */
const IMGS = "__IMG_DATA__";

const DB = {
  "CASE-001": {
    id:"CASE-001", title:"正常后前位胸片", modality:"CR", bodyPart:"胸部",
    img: IMGS["CASE-001"],
    atlas:{ id:"ATLAS-CHEST-PA-6", name:"胸片六分区（PA）", level:"global",
      note:"第 2/4 前肋下缘水平线划分上中下野，纵隔与膈下单独成区。",
      laterality:"pa_chest：图像左侧 = 患者右侧",
      annotator:"human", annotatedAt:"2026-11-15" },
    source:{ page:"https://commons.wikimedia.org/wiki/File:Normal_posteroanterior_(PA)_chest_radiograph_(X-ray).jpg",
      license:"CC0", artist:"Mikael Häggström" },
    regions:[
      {id:"REG-001-RUL", name:"右肺上野", coords:[0.115,0.09,0.360,0.26], imageSide:"left", patientSide:"right",
       signs:["SIGN-003 结节","SIGN-005 空洞","SIGN-004 肿块"]},
      {id:"REG-001-RML", name:"右肺中野", coords:[0.115,0.35,0.360,0.23], imageSide:"left", patientSide:"right",
       signs:["SIGN-002 实变","SIGN-014 空气支气管征","SIGN-019 肺不张"]},
      {id:"REG-001-RLL", name:"右肺下野", coords:[0.115,0.58,0.360,0.24], imageSide:"left", patientSide:"right",
       signs:["SIGN-007 胸腔积液","SIGN-019 肺不张","SIGN-020 胸膜增厚"]},
      {id:"REG-001-LUL", name:"左肺上野", coords:[0.535,0.09,0.360,0.26], imageSide:"right", patientSide:"left",
       signs:["SIGN-003 结节","SIGN-005 空洞","SIGN-004 肿块"]},
      {id:"REG-001-LML", name:"左肺中野", coords:[0.535,0.35,0.360,0.23], imageSide:"right", patientSide:"left",
       signs:["SIGN-002 实变","SIGN-014 空气支气管征","SIGN-010 心影增大"]},
      {id:"REG-001-LLL", name:"左肺下野", coords:[0.535,0.58,0.360,0.24], imageSide:"right", patientSide:"left",
       signs:["SIGN-007 胸腔积液","SIGN-019 肺不张","SIGN-008 气胸"]},
      {id:"REG-001-MED", name:"纵隔", coords:[0.475,0.09,0.060,0.71], imageSide:"midline", patientSide:"midline",
       signs:["SIGN-009 纵隔增宽","SIGN-028 淋巴结增大"]},
      {id:"REG-001-SUB", name:"膈下", coords:[0.200,0.82,0.600,0.16], imageSide:"midline", patientSide:"midline",
       signs:["SIGN-026 腹腔积液","SIGN-060 后方声影"]}
    ],
    claims:[
      {id:"CLM-001", regionId:"REG-001-RML", status:"dual",
       text:"右肺中野透亮度均匀，未见明确局灶性密度增高、结节或空洞影。",
       spatial:{bbox:[0.135,0.365,0.320,0.200], atlasId:"ATLAS-CHEST-PA-6", annotator:"human", annotatedAt:"2026-11-15", hash:"a91f3c"},
       doc:{kind:"guideline", title:"ACR Lung-RADS", version:"2022", locator:"类别 1 · 筛查随访",
         excerpt:"未见肺结节或仅见良性表现者，按年度低剂量 CT 继续筛查。",
         url:"https://www.acr.org/Clinical-Resources/Reporting-and-Data-Systems/Lung-Rads",
         retrievedAt:"2026-11-15", hash:"7c2e08"},
       note:"正常对照：该分区无阳性表现，文献侧给出类别 1 的随访口径。"}
    ]
  },

  "CASE-006": {
    id:"CASE-006", title:"大叶性肺炎（箭头标注）", modality:"CR", bodyPart:"胸部",
    img: IMGS["CASE-006"],
    atlas:{ id:"ATLAS-CHEST-PA-6", name:"胸片六分区（PA）", level:"global",
      note:"同一套六分区模板，复用于所有 PA 胸片；换图不重标模板，只重标分区边界。",
      laterality:"pa_chest：图像左侧 = 患者右侧",
      annotator:"human", annotatedAt:"2026-11-15" },
    source:{ page:"https://commons.wikimedia.org/wiki/File:Lobar_pneumonia.jpg",

/* PURE-START 纯计算：无 DOM 依赖，可被单测直接引用 */
function area(r){ return Math.max(0,r[2]) * Math.max(0,r[3]); }
function inter(a,b){
  const x1=Math.max(a[0],b[0]), y1=Math.max(a[1],b[1]);
  const x2=Math.min(a[0]+a[2], b[0]+b[2]), y2=Math.min(a[1]+a[3], b[1]+b[3]);
  return Math.max(0,x2-x1) * Math.max(0,y2-y1);
}
function scoreRegion(bbox, region){
  const A = inter(bbox, region.coords);
  const coverage = A / Math.max(1e-9, area(bbox));
  const purity = A / Math.max(1e-9, area(region.coords));
  return { region, A, coverage, purity, score: 0.7*coverage + 0.3*purity };
}
const CROSS_GAP = 0.15;     // 主次分差阈值
const MIN_COVER  = 0.35;    // 最低覆盖率
const SECOND_MIN = 0.25;    // 次候选最低覆盖率
function judge(scored){
  const top = scored[0], second = scored[1];
  if(!top || top.coverage < MIN_COVER) return { status:"uncovered", top, second };
  if(second && (top.score - second.score) < CROSS_GAP && second.coverage > SECOND_MIN)
    return { status:"cross", top, second };
  return { status:"single", top, second };
}
/* PURE-END */

function drawRegions(){
  const ov = $("#overlay");
  ov.innerHTML = "";
  const d = cur();
  d.regions.forEach(r=>{
    const n = el("div","region");
    n.dataset.id = r.id;
    n.style.left = pct(r.coords[0]);
    n.style.top = pct(r.coords[1]);
    n.style.width = pct(r.coords[2]);
    n.style.height = pct(r.coords[3]);
    n.appendChild(el("span","rlabel", esc(r.name)));
    ov.appendChild(n);
  });
  $("#frame").classList.toggle("regions-off", !$("#showRegions").checked);
}

function clearSel(){
  const ov = $("#overlay");
  ov.querySelectorAll(".selbox,.highlight").forEach(n=>n.remove());
}

function markHot(id){
  if(S.hot === id) return;
  S.hot = id;
  $$("#overlay .region").forEach(n=>n.classList.toggle("hot", n.dataset.id===id));
}

let drag = null;

function relPos(e){
  const r = $("#overlay").getBoundingClientRect();
  return [ clamp01((e.clientX-r.left)/r.width), clamp01((e.clientY-r.top)/r.height) ];
}

$("#overlay").addEventListener("mousedown", (e)=>{
  e.preventDefault();
  drag = { start: relPos(e), box:null, moved:false };
  clearSel();
});

window.addEventListener("mousemove", (e)=>{
  if(!drag){
    const [x,y] = relPos(e);
    const r = pointHit(x,y);
    markHot(r ? r.id : null);
    return;
  }
  const [x,y] = relPos(e);
  const x0 = drag.start[0], y0 = drag.start[1];
  const bx = [Math.min(x0,x), Math.min(y0,y), Math.abs(x-x0), Math.abs(y-y0)];
  if(bx[2] > 0.006 || bx[3] > 0.006) drag.moved = true;
  drag.box = bx;
  paintSel(bx);
});

window.addEventListener("mouseup", ()=>{
  if(!drag) return;
  const d = drag; drag = null;
  if(!d.moved){
    // 点定位
    const r = pointHit(d.start[0], d.start[1]);
    if(r){ S.sel = null; doPoint(r); }
    else { S.sel=null; renderUncovered("点落在已标注分区之外，本工具不对未标注区域作推断。"); }
    return;
  }
  const b = d.box;
  if(b[2] < 0.015 || b[3] < 0.015){ renderUncovered("选区过小，请扩大后再定位。"); return; }
  if(area(b) > 0.60){ renderUncovered("选区过大，请缩小到单一分区后再定位。"); return; }
  doLocate(b);
});

function paintSel(b){
  clearSel();
  const n = el("div","selbox");
  n.style.left=pct(b[0]); n.style.top=pct(b[1]);
  n.style.width=pct(b[2]); n.style.height=pct(b[3]);
  n.appendChild(el("span","sz", (b[2]*100).toFixed(0)+"×"+(b[3]*100).toFixed(0)+"%"));
  $("#overlay").appendChild(n);
  $("#vCoord").textContent = "bbox ["+b.map(v=>v.toFixed(3)).join(", ")+"]";
}

function pointHit(x,y){
  const d = cur();
  // 小面积优先，避免大区盖住小区
  const hits = d.regions.filter(r=>{
    const c=r.coords;
    return x>=c[0] && x<=c[0]+c[2] && y>=c[1] && y<=c[1]+c[3];
  }).sort((a,b)=>area(a.coords)-area(b.coords));
  return hits[0] || null;
}

/* ============================================================
   定位核心
   ============================================================ */
function doLocate(bbox){
  const d = cur();
  const scored = d.regions.map(r=>scoreRegion(bbox,r)).sort((a,b)=>b.score-a.score);
  const j = judge(scored);
  const res = { bbox, top:j.top, second:j.second, scored, mode:"box" };

  if(j.status === "uncovered"){
    renderUncovered("该图未标注此区域，本工具不对未标注区域作推断。");
    S.locate = null;
    return;
  }
  if(j.status === "cross"){
    res.cross = true;
    S.locate = res;
    renderCross(res);
    return;
  }
  S.locate = res;
  renderLocate(res);
}

function doPoint(region){
  const d = cur();
  const res = { bbox: region.coords.slice(), top:{region, coverage:1, purity:1, score:1}, second:null, mode:"point" };
  S.locate = res;
  renderLocate(res);
  // 点定位也画个框提示
  paintSel(region.coords);
  $$("#overlay .region").forEach(n=>n.classList.toggle("hit", n.dataset.id===region.id));
}

const SIDE_LABEL = { right:"患者右侧", left:"患者左侧", midline:"中线", unknown:"侧别未知" };
const SIDE_CLS = { right:"side-r", left:"side-l", midline:"side-m", unknown:"side-m" };
const IMG_SIDE = { right:"图像右侧", left:"图像左侧", midline:"图像中线", unknown:"—" };

function renderUncovered(msg){
  S.locate = null;
  const box = $("#locateBox");
  box.innerHTML = "";
  const w = el("div","locate");
  w.appendChild(el("div","warnline red", "✕ " + esc(msg)));
  box.appendChild(w);
  $("#locateMeta").textContent = "未覆盖";
  $("#claims").innerHTML = '<div class="empty"><b>未定位到已标注分区</b>不展示条目，也不推测区域对应的知识。</div>';
  $("#claimMeta").textContent = "未覆盖";
  updateGate([]);
  clearSel();
}

function renderCross(res){
  const box = $("#locateBox");
  box.innerHTML = "";
  const w = el("div","locate");
  const a = res.top, b = res.second;
  w.appendChild(el("div","warnline",
    "跨区：选区同时落在两个分区，重叠比例接近。请缩小范围，或直接点选分区。"));
  const rows = [
    ["候选一", a.region.name + " · 框内 " + (a.coverage*100).toFixed(0) + "%"],
    ["候选二", b.region.name + " · 框内 " + (b.coverage*100).toFixed(0) + "%"],
    ["差值", ((a.score-b.score)*100).toFixed(1) + " 分（阈值 15）"]
  ];
  rows.forEach(([k,v])=>{
    const r = el("div","lrow");
    r.appendChild(el("span","k",k));
    r.appendChild(el("span","v", esc(v)));
    w.appendChild(r);
  });
  const btnRow = el("div","tagrow");
  [a,b].forEach(x=>{
    const t = el("button","tag", "定位到 " + esc(x.region.name));
    t.style.cursor="pointer";
    t.addEventListener("click", ()=>{ S.sel=null; doPoint(x.region); });
    btnRow.appendChild(t);
  });
  w.appendChild(btnRow);
  box.appendChild(w);
  $("#locateMeta").textContent = "跨区";
  $("#claims").innerHTML = '<div class="empty"><b>跨区待确认</b>选区同时覆盖两个分区，请缩小范围或点上方按钮指定分区；<br>未确认前不展示条目。</div>';
  $("#claimMeta").textContent = "待确认";
  updateGate([]);
  $$("#overlay .region").forEach(n=>{
    const id = n.dataset.id;
    n.classList.toggle("hit", id===a.region.id || id===b.region.id);
  });
}

function renderLocate(res){
  const d = cur();
  const box = $("#locateBox");
  box.innerHTML = "";
  if(!res){ box.innerHTML = '<div class="empty"><b>等待框选</b>拖框定位解剖分区，或单击图上任一点</div>'; renderClaims(null); return; }

  const r = res.top.region;
  const w = el("div","locate");

  // 分区 + 侧别
  const row1 = el("div","lrow");
  row1.appendChild(el("span","k","解剖分区"));
  const v1 = el("span","v");
  v1.innerHTML = "<b>"+esc(r.name)+"</b>" +
    '<span class="side-badge '+SIDE_CLS[r.patientSide]+'">'+SIDE_LABEL[r.patientSide]+'</span>';
  row1.appendChild(v1);
  w.appendChild(row1);

  // 侧别规则
  const row2 = el("div","lrow");
  row2.appendChild(el("span","k","侧别映射"));
  row2.appendChild(el("span","v", esc(IMG_SIDE[r.imageSide]) + " · " + esc(d.atlas.laterality)));
  w.appendChild(row2);

  // 定位依据
  const row3 = el("div","lrow");
  row3.appendChild(el("span","k","定位依据"));
  row3.appendChild(el("span","v", esc(d.atlas.name + " · 人工标注 · " + d.atlas.annotatedAt)));
  w.appendChild(row3);

  // 覆盖度
  const row4 = el("div","lrow");
  row4.appendChild(el("span","k", res.mode==="point" ? "定位方式" : "覆盖度"));
  const v4 = el("span","v");
  if(res.mode==="point"){
    v4.innerHTML = "点定位（取点所在分区）";
  }else{
    const cov = res.top.coverage, pur = res.top.purity;
    v4.innerHTML = "框内 <b>"+(cov*100).toFixed(0)+"%</b> 落在该区 · 该区被框住 <b>"+(pur*100).toFixed(0)+"%</b>"
      + '<div class="meter"><i style="width:'+(cov*100).toFixed(1)+'%"></i></div>';
  }
  row4.appendChild(v4);
  w.appendChild(row4);

  // 边界提示
  if(res.mode==="box" && res.second && res.second.coverage > 0.12){
    const row5 = el("div","lrow");
    row5.appendChild(el("span","k","边界提示"));
    row5.appendChild(el("span","v", "与「"+res.second.region.name+"」重叠 "+(res.second.coverage*100).toFixed(0)+"%，需精确请缩小范围"));
    w.appendChild(row5);
  }

  // 可对照征象
  const row6 = el("div","lrow");
  row6.appendChild(el("span","k","可对照征象"));
  const v6 = el("div","v");
  const tags = el("div","tagrow");
  r.signs.forEach(s=>tags.appendChild(el("span","tag", esc(s))));
  v6.appendChild(tags);
  row6.appendChild(v6);
  w.appendChild(row6);

  // 能力声明
  if(d.atlas.level === "local"){
    const wl = el("div","warnline", "该模态为局部视野：只给图像内相对位置，不推断左叶/右叶。");
    w.appendChild(wl);
  }

  box.appendChild(w);
  $("#locateMeta").textContent = res.mode==="point" ? "点定位" : "已定位";
  $$("#overlay .region").forEach(n=>n.classList.toggle("hit", n.dataset.id===r.id));
  renderClaims(r);
}

/* ============================================================
   渲染：双引用结论
   ============================================================ */
function claimsOf(region){
  const d = cur();
  return d.claims.filter(c=>c.regionId===region.id);
}

function renderClaims(region){
  const box = $("#claims");
  box.innerHTML = "";
  if(!region){
    box.innerHTML = '<div class="empty">定位后显示该分区的可对照条目</div>';
    $("#claimMeta").textContent = "—";
    updateGate([]);
    return;
  }
  const list = claimsOf(region);
  if(!list.length){
    box.innerHTML = '<div class="empty"><b>该分区暂无可对照条目</b>库内未为此分区绑定征象或条款，不作推断。</div>';
    $("#claimMeta").textContent = "0 条";
    updateGate([]);
    return;
  }
  $("#claimMeta").textContent = list.length + " 条 · " + region.name;
  updateGate(list);

  list.forEach(c=>{
    const n = el("div","claim" + (c.status==="broken" ? " blocked" : ""));
    n.appendChild(el("div","ctext", esc(c.text)));

    const meta = el("div","cmeta");
    const stTxt = { dual:"双引用", single:"单引用", broken:"已拦截" }[c.status];
    meta.appendChild(el("span","st "+c.status, stTxt));

    // 空间锚点
    if(c.spatial){
      const b = el("button","cite sp", '<span class="ic">▣</span><span class="lbl">影像 '+esc(region.name)+'</span>');
      b.title = "点击在图上高亮该区域";
      b.addEventListener("click", ()=> highlightSpatial(c));
      meta.appendChild(b);
    }else{
      meta.appendChild(el("span","cite sp off", '<span class="ic">▣</span><span class="lbl">无空间锚点</span>'));
    }

    // 文献锚点
    if(c.doc){
      const k = { guideline:"条款", sign:"词条", group:"影像组" }[c.doc.kind] || "文献";
      const b = el("button","cite dc", '<span class="ic">▤</span><span class="lbl">'+k+' '+esc(c.doc.locator.split("·")[0].trim())+'</span>');
      b.title = "点击查看原文摘录与核验";
      b.addEventListener("click", ()=> openDoc(c));
      meta.appendChild(b);
    }

    n.appendChild(meta);

    if(c.status === "single"){
      n.appendChild(el("div","cnote amber", "△ " + esc(c.gateReason || "缺少一侧锚点，已降级为单引用。")));
    }
    if(c.status === "broken"){
      n.appendChild(el("div","cnote red",
        "✕ " + esc(c.gateReason || "引用未通过校验。") +
        '<br><span class="mono" style="font-size:10.5px">expected '+esc((c.gate&&c.gate.expected)||"—")+' / actual '+esc((c.gate&&c.gate.actual)||"—")+'</span>'));
    }
    if(c.note && c.status !== "broken"){
      n.appendChild(el("div","cnote", esc(c.note)));
    }

    n.addEventListener("click", (e)=>{
      if(e.target.closest("button")) return;
      highlightSpatial(c);
      if(S.sync) openDoc(c);
    });
    box.appendChild(n);
  });
}

function updateGate(list){
  const n = { dual:0, single:0, broken:0 };
  list.forEach(c=> n[c.status] = (n[c.status]||0)+1);
  $("#gDual").textContent = n.dual;
  $("#gSingle").textContent = n.single;
  $("#gBroken").textContent = n.broken;
}

/* ============================================================
   空间锚点高亮
   ============================================================ */
function highlightSpatial(c){
  if(!c.spatial) return;
  $("#overlay").querySelectorAll(".highlight").forEach(n=>n.remove());
  const b = c.spatial.bbox;
  const n = el("div","highlight");
  n.style.left=pct(b[0]); n.style.top=pct(b[1]);
  n.style.width=pct(b[2]); n.style.height=pct(b[3]);
  $("#overlay").appendChild(n);
  $("#frame").scrollIntoView({behavior:"smooth", block:"nearest"});
  $("#vCoord").textContent = "spatial " + c.spatial.hash + " · bbox [" + b.map(v=>v.toFixed(3)).join(", ") + "]";
}

/* ============================================================
   文献抽屉
   ============================================================ */
function openDoc(c){
  const d = c.doc;
  if(!d) return;
  $("#dTitle").textContent = d.title;
  $("#dSub").textContent = d.locator + " · " + d.version;

  const body = $("#dBody");
  body.innerHTML = "";

  // 双腿示意
  const legs = el("div","legs");
  const sp = el("div","leg sp");
  sp.appendChild(el("div","lh","空间锚点"));
  sp.appendChild(el("div","lv", c.spatial ? (cur().id + " · " + (S.locate ? S.locate.top.region.name : "分区")) : "缺失"));
  const dc = el("div","leg");
  dc.appendChild(el("div","lh","文献锚点"));
  dc.appendChild(el("div","lv", esc(d.title + " · " + d.version)));
  legs.appendChild(sp); legs.appendChild(dc);
  body.appendChild(legs);

  // 校验状态
  const ver = el("div","ver " + (c.status==="broken" ? "bad" : c.status==="single" ? "warn" : "ok"));
  ver.innerHTML = c.status==="broken"
    ? "✕ 校验未通过 · 摘录与原文不一致，已拦截"
    : c.status==="single"
      ? "△ 单引用 · " + esc(c.gateReason || "缺少空间锚点")
      : "✓ 双引用完整 · 空间锚点 + 文献锚点均已校验";
  body.appendChild(ver);

  // 摘录
  const s1 = el("div","dsec");
  s1.appendChild(el("div","k","原文摘录（excerpt）"));
  s1.appendChild(el("div","excerpt" + (c.status==="broken"?" bad":""), esc(d.excerpt)));
  body.appendChild(s1);

  // 元数据
  const s2 = el("div","dsec");
  s2.appendChild(el("div","k","引用元数据"));
  const kv = el("div","kv");
  const rows = [
    ["文献类型", {guideline:"指南条款", sign:"征象词条", group:"影像组"}[d.kind] || d.kind],
    ["版本", d.version],
    ["定位符", d.locator],
    ["抓取时间", d.retrievedAt],
    ["摘录 hash", d.hash],
  ];
  if(c.spatial){
    rows.push(["空间锚点", c.spatial.atlasId + " · " + c.spatial.hash]);
    rows.push(["标注", c.spatial.annotator + " · " + c.spatial.annotatedAt]);
  }
  rows.forEach(([k,v])=>{
    kv.appendChild(el("div","k",esc(k)));
    kv.appendChild(el("div","v mono",esc(v)));
  });
  s2.appendChild(kv);
  body.appendChild(s2);

  // 链接
  const s3 = el("div","dsec");
  s3.appendChild(el("div","k","原文入口"));
  const a = el("a","dlink", esc(d.url));
  a.href = d.url; a.target = "_blank"; a.rel = "noopener";
  s3.appendChild(a);
  const tip = el("div","cnote", "外部链接仅作来源指引；条款阈值以官方当前版本为准。");
  s3.appendChild(tip);
  body.appendChild(s3);

  $("#drawer").classList.add("open");
}

$("#dClose").addEventListener("click", ()=> $("#drawer").classList.remove("open"));
document.addEventListener("keydown", (e)=>{ if(e.key==="Escape") $("#drawer").classList.remove("open"); });

/* ============================================================
   开关
   ============================================================ */
$("#showRegions").addEventListener("change", (e)=>{
  $("#frame").classList.toggle("regions-off", !e.target.checked);
});
$("#syncMode").addEventListener("change", (e)=>{ S.sync = e.target.checked; });

/* ============================================================
   启动
   ============================================================ */
buildTabs();
selectImage("CASE-001");
</script>
</body>
</html>
